name: ساخت و آزمون APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    name: تست موتور و JNI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Rust
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: تست قواعد، حالت و جست‌وجو
        run: cargo test --locked --release --all-targets
      - name: عبور واقعی از JNI در JVM
        run: scripts/test-jni.sh
  apk:
    name: ساخت ARM64 اندروید
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: SDK و NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
      - name: Rust و هدف ARM64
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup target add aarch64-linux-android
      - name: کتابخانهٔ native با صفحات ۱۶ کیلوبایتی
        run: scripts/build-native.sh
      - name: تست، Lint و APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: تأیید امضا و نام APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: app/build/reports/
          if-no-files-found: ignore
